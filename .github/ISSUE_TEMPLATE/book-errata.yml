name: Book errata or reproducibility report
description: Report a suspected defect in the book or controlled companion material
title: "[Book report] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the book. A report is verified before it is classified as confirmed errata.
  - type: input
    id: version
    attributes:
      label: Book version / edition
      placeholder: "v3.16, First Edition · Code-Verified Illustrated Study Edition · 2026"
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Format
      placeholder: "Paperback, hardcover, EPUB, or companion repository"
  - type: input
    id: location
    attributes:
      label: Location
      description: Print page/main-matter folio or EPUB chapter/section, plus figure/code/equation identifier if applicable.
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Suspected issue type
      options:
        - Technical statement or explanation
        - Code or displayed output
        - Equation or mathematical notation
        - Figure or table
        - Dataset/source/provenance
        - Layout, navigation, or cross-reference
        - Accessibility
        - Bibliographic or retailer metadata
        - Compatibility/currency change
        - Other
  - type: textarea
    id: observed
    attributes:
      label: What appears to be wrong?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction or source evidence
      description: Include commands, output, dataset/version information, screenshots, or authoritative references where relevant.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python and library versions, hardware/service details where relevant.
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction or clarification
